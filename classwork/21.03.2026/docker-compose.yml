version: '3.8'

services:
  web:
    build: ./task3
    ports:
      - "80:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/mydb
      - DB_USER=postgres
      - DB_PASSWORD=example
    depends_on:
      - db
    restart: on-failure

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
